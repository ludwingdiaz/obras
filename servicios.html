<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicios | Servicios Integrales SGM</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="navbar-container"></div>

  <main class="container my-5 pt-5">
    <div class="text-center mb-4">
      <h1 class="fw-bold">Nuestros Servicios</h1>
      <p class="text-muted">Selecciona una categoría para filtrar nuestras soluciones de obra y reforma.</p>
    </div>

    <!-- Contenedor donde tu JS inserta los botones de filtro -->
    <div id="contenedor-filtros" class="text-center mb-5"></div>

    <!-- Contenedor donde tu JS inserta las tarjetas -->
    <div id="contenedor-servicios" class="row g-4"></div>
  </main>

  <!-- MODAL DE DETALLE (Con los IDs que espera tu JS) -->
  <div class="modal fade" id="modalServicio" tabindex="-1" aria-labelledby="modalTitulo" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <div>
            <h2 class="modal-title h5 fw-bold mb-0" id="modalTitulo">Nombre del servicio</h2>
            <span class="badge bg-warning text-dark mt-1" id="modalCategoria">Categoría</span>
          </div>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body p-4">
          <div class="row g-4">
            <div class="col-md-5">
              <img id="modalImagen" src="" alt="Servicio" class="img-fluid rounded shadow-sm mb-3" style="width: 100%; height: 200px; object-fit: cover;">
              <div class="p-3 bg-light rounded border">
                <h3 class="h6 fw-bold text-primary mb-2">Ventajas Principales</h3>
                <p id="modalVentajas" class="small text-muted mb-0"></p>
              </div>
            </div>
            <div class="col-md-7">
              <p id="modalDescripcion" class="text-muted mb-3"></p>
              
              <div class="mb-3">
                <h3 class="h6 fw-bold text-dark"><i class="bi bi-info-circle text-primary me-2"></i>¿Cuándo conviene realizarlo?</h3>
                <p id="modalCuandoConviene" class="small text-muted mb-0"></p>
              </div>

              <h3 class="h6 fw-bold text-dark mb-2"><i class="bi bi-check2-square text-success me-2"></i>¿Qué incluye?</h3>
              <ul id="modalIncluye" class="small text-muted mb-0 ps-3"></ul>
            </div>
          </div>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
          <a id="btnPresupuestoModal" href="contacto.html" class="btn btn-warning btn-sm fw-bold text-dark">
            Pedir presupuesto de este servicio
          </a>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/servicios.js"></script>
</body>
</html>
